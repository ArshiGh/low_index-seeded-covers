name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build wheel
        run: python -m pip wheel --no-deps -w wheelhouse .

      - name: Install wheel
        run: python -m pip install --no-deps wheelhouse/*.whl

      - name: Verify version
        run: |
          python - <<'PY'
          import low_index
          assert low_index.__version__ == "1.3+seeded.covers.1"
          print(low_index.__version__)
          PY

      - name: Run regression tests
        run: python -m low_index.test
